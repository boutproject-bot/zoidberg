# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        # System libraries needed by the gmsh wheel
        sudo apt-get update
        sudo apt-get install -y libglu1-mesa libxcursor1 libxft2 libxinerama1
        python -m pip install --upgrade pip
        python -m pip install ruff flake8
        python -m pip install .[tests,unstructured]
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 zoidberg --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 zoidberg --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with ruff
      run: |
        ruff check zoidberg --output-format=github
    - name: Test with pytest
      run: |
        pytest
